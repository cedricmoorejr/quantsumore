name: Download and Process Stock Listed Files


on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'
  push:
    branches:
      - v2.1.5b1
      
jobs:
  download-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Python script to download and process stock data
        run: python __stock_config.py

      - name: Commit and Push stock_tickers.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add files/stock_tickers.txt
          git diff --staged --exit-code || (git commit -m "Update stock exchange data" && git push)
